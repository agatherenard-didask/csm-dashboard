```
<div id="overlay" onclick="closeDetails()" class="fixed inset-0 bg-[#1a1a1a]/10 backdrop-blur-sm z-40 hidden transition-opacity"></div>
<div id="side-panel" class="fixed top-4 right-4 bottom-4 w-full md:w-[450px] bg-white z-50 rounded-3xl side-panel closed flex flex-col border border-slate-100">

        <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Focus IA</h3>

            </div>
            <div class="flex justify-between p-3 bg-orange-50 border border-orange-100 rounded-xl">
                <span class="text-xs font-bold text-[#f9b494]">📅 Prochain RDV</span><span id="sp-next" class="text-xs font-bold text-[#f9b494]"></span>

        <button onclick="setTab('exp')" id="tab-exp" class="tab-btn tab-inactive pb-4 text-sm">Opportunités</button>

<div class="bg-slate-50 border-b border-slate-100 px-8 py-4 z-20 relative">
    <div class="max-w-[1400px] mx-auto flex gap-4">
        <input type="text" id="searchInput" placeholder="Rechercher un compte..." onkeyup="drawTable()" class="px-4 py-2 rounded-lg border border-slate-200 text-xs w-64 focus:border-[#f9b494] focus:outline-none">
        <select id="csmFilter" onchange="drawTable()" class="px-4 py-2 rounded-lg border border-slate-200 text-xs text-slate-600 focus:outline-none"><option value="all">Tous CSM</option><option value="Adeline">Adeline</option><option value="Agathe">Agathe</option><option value="Alexandre">Alexandre</option><option value="Antoine">Antoine</option><option value="Florian">Florian</option></select>
        <select id="kamFilter" onchange="drawTable()" class="px-4 py-2 rounded-lg border border-slate-200 text-xs text-slate-600 focus:outline-none"><option value="all">Tous KAM</option><option value="Marion">Marion</option><option value="Valérie">Valérie</option></select>
        <select id="tierFilter" onchange="drawTable()" class="px-4 py-2 rounded-lg border border-slate-200 text-xs text-slate-600 focus:outline-none"><option value="all">Tous Accompagnements</option><option value="Premium">Premium</option><option value="Standard">Standard</option><option value="Light">Light</option></select>

<main class="max-w-[1400px] mx-auto px-8 py-8 mb-20">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 pb-4">
        <table class="w-full text-left">
            <thead id="table-head"></thead>

<script>
    const DB = [
        { id: "1", name: "Uptoo", tier: "Premium", csm: "Agathe", kam: "Marion", pulse: 5, start: "01/01/2026", end: "31/12/2026", uLog: 2, lLog: 1, meet: 10, next: "15/04/2026", aiAct: true, aiMsg: 18, coachAct: false, coachMsg: 0, trend: 5, seatsUsed: 120, seatsContract: 100, creditsUsed: 450, creditsContract: 500 },
        { id: "2", name: "Clariane", tier: "Premium", csm: "Adeline", kam: "Valérie", pulse: 2, start: "15/05/2025", end: "15/05/2026", uLog: 45, lLog: 60, meet: 65, next: null, aiAct: true, aiMsg: 3, coachAct: false, coachMsg: 0, trend: -12, seatsUsed: 45, seatsContract: 50, creditsUsed: 100, creditsContract: 200 },
        { id: "3", name: "Marvesting", tier: "Standard", csm: "Antoine", kam: "Marion", pulse: 4, start: "20/01/2026", end: "20/01/2027", uLog: 5, lLog: 2, meet: 45, next: "25/03/2026", aiAct: true, aiMsg: 12, coachAct: true, coachMsg: 8, trend: 2, seatsUsed: 80, seatsContract: 80, creditsUsed: 550, creditsContract: 500 },
        { id: "4", name: "Tasq-OM", tier: "Light", csm: "Florian", kam: "Valérie", pulse: 3, start: "01/04/2025", end: "20/05/2026", uLog: 25, lLog: 10, meet: 120, next: null, aiAct: false, aiMsg: 0, coachAct: false, coachMsg: 0, trend: -5, seatsUsed: 15, seatsContract: 20, creditsUsed: 50, creditsContract: 100 },
        { id: "5", name: "Cap Retraite", tier: "Standard", csm: "Alexandre", kam: "Marion", pulse: 1, start: "12/06/2025", end: "12/06/2026", uLog: 70, lLog: 80, meet: 90, next: null, aiAct: false, aiMsg: 0, coachAct: false, coachMsg: 0, trend: -20, seatsUsed: 10, seatsContract: 50, creditsUsed: 10, creditsContract: 200 },
        { id: "6", name: "L'Oréal", tier: "Premium", csm: "Agathe", kam: "Valérie", pulse: 5, start: "01/02/2026", end: "31/01/2027", uLog: 1, lLog: 1, meet: 5, next: "10/05/2026", aiAct: true, aiMsg: 25, coachAct: true, coachMsg: 15, trend: 15, seatsUsed: 510, seatsContract: 500, creditsUsed: 1200, creditsContract: 1000 }
    ];

    let activeTab = 'all';
    let sortCol = 'score';
    let sortAsc = false;

    function getScoreDetails(c) {
        let details = { total: 0, pulsePts: 0, engPts: 0, relPts: 0, proPts: 0, avgLog: 0, meetMax: 0 };
        details.pulsePts = {5:20, 4:15, 3:10, 2:5, 1:0}[c.pulse] || 10;
        details.avgLog = (c.uLog + c.lLog) / 2;
        details.engPts = (details.avgLog <= 15 ? 40 : (details.avgLog <= 30 ? 20 : 0));
        details.meetMax = c.tier === "Premium" ? 30 : (c.tier === "Standard" ? 90 : 365);

        if (c.meet <= details.meetMax) details.relPts = 30;
        else if (c.meet <= details.meetMax + 30) details.relPts = 15;
        else details.relPts = 0;

        details.proPts = c.next ? 10 : 0;
        details.total = details.pulsePts + details.engPts + details.relPts + details.proPts;
        if(details.total > 100) details.total = 100;
        return details;
    }

    function calcScore(c) { return getScoreDetails(c).total; }
    function getDays(dStr) {
        let p = dStr.split('/');
        return Math.round((new Date(p[2], p[1]-1, p[0]) - new Date()) / 86400000);
    }

    function getChurnRisk(c, healthScore) {
        let days = getDays(c.end);
        let healthRisk = Math.round(60 - (healthScore * 0.6));
        let timeRisk = 0;
        if (days <= 0) timeRisk = 40;
        else if (days < 120) timeRisk = Math.round(40 - (days / 120 * 40));
        return { total: healthRisk + timeRisk, healthRisk: healthRisk, timeRisk: timeRisk, daysLeft: days };
    }

    function setTab(tab) {
        activeTab = tab;
        ['all', 'churn', 'renew', 'exp', 'ai'].forEach(t => {
            document.getElementById('tab-' + t).className = (t === tab) ? "tab-btn tab-active pb-4 text-sm flex items-center" : "tab-btn tab-inactive pb-4 text-sm flex items-center";
        });
        drawTable();
    }

    function toggleSort(col) {
        if (sortCol === col) sortAsc = !sortAsc;
        else { sortCol = col; sortAsc = (col === 'name'); }
        drawTable();
    }

    function getSortIcon(col) {
        if (sortCol !== col) return '<span class="text-slate-300 ml-1">↕️</span>';
        return sortAsc ? '<span class="text-[#f9b494] ml-1">↑</span>' : '<span class="text-[#f9b494] ml-1">↓</span>';
    }

    function simulateQuickAction(action, clientName) {
        event.stopPropagation();
        alert(`[MVP Demo] Ouverture de HubSpot pour : ${action} avec ${clientName}`);
    }

    function drawTable() {
        let search = document.getElementById('searchInput').value.toLowerCase();
        let csmF = document.getElementById('csmFilter').value;
        let kamF = document.getElementById('kamFilter').value;
        let tierF = document.getElementById('tierFilter').value;

        let data = DB.filter(c =>
            c.name.toLowerCase().includes(search) &&
            (csmF === 'all' || c.csm === csmF) &&
            (kamF === 'all' || c.kam === kamF) &&
            (tierF === 'all' || c.tier === tierF)
        );

        if (activeTab === 'churn') data = data.filter(c => getChurnRisk(c, calcScore(c)).total >= 50);
        if (activeTab === 'renew') data = data.filter(c => getDays(c.end) <= 120);
        if (activeTab === 'exp') data = data.filter(c => calcScore(c) >= 70 || c.seatsUsed > c.seatsContract || c.creditsUsed > c.creditsContract);

        data.sort((a, b) => {
            if (sortCol === 'name') return sortAsc ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
            else if (sortCol === 'score') return sortAsc ? calcScore(a) - calcScore(b) : calcScore(b) - calcScore(a);
            else if (sortCol === 'risk') return sortAsc ? getChurnRisk(a, calcScore(a)).total - getChurnRisk(b, calcScore(b)).total : getChurnRisk(b, calcScore(b)).total - getChurnRisk(a, calcScore(a)).total;
        });

        document.getElementById('churn-count').innerText = DB.filter(c => getChurnRisk(c, calcScore(c)).total >= 50).length;
        document.getElementById('renew-count').innerText = DB.filter(c => getDays(c.end) <= 120).length;

        let currentGlobalScore = data.length > 0 ? Math.round(data.reduce((a, c) => a + calcScore(c), 0) / data.length) : 0;
        document.getElementById('global-score').innerHTML = `${currentGlobalScore}<span class="text-base text-[#f9b494] ml-1">/100</span>`;

        let th = document.getElementById('table-head');
        if (activeTab === 'ai') {
            th.innerHTML = `<tr class="bg-indigo-50/50 text-indigo-400 text-[10px] uppercase font-bold border-b border-indigo-100"><th class="px-6 py-4 cursor-pointer hover:text-indigo-600" onclick="toggleSort('name')">Client ${getSortIcon('name')}</th><th class="px-4 py-4 text-center">🤖 Assistant IA</th><th class="px-4 py-4 text-center">👟 Coach</th><th class="px-6 py-4 text-right">Actions</th></tr>`;
        } else if (activeTab === 'exp') {
            th.innerHTML = `<tr class="bg-slate-50 text-slate-400 text-[10px] uppercase font-bold border-b border-slate-100"><th class="px-6 py-4 cursor-pointer hover:text-slate-700" onclick="toggleSort('name')">Client & Contrat ${getSortIcon('name')}</th><th class="px-4 py-4 cursor-pointer hover:text-slate-700 w-48" onclick="toggleSort('score')">Health Score ${getSortIcon('score')}</th><th class="px-4 py-4">Sièges (Utilisés / Contrat)</th><th class="px-4 py-4">Crédits (Utilisés / Contrat)</th><th class="px-6 py-4 text-right">Actions</th></tr>`;
        } else {
            th.innerHTML = `<tr class="bg-slate-50 text-slate-400 text-[10px] uppercase font-bold border-b border-slate-100"><th class="px-6 py-4 cursor-pointer hover:text-slate-700" onclick="toggleSort('name')">Client & Contrat ${getSortIcon('name')}</th><th class="px-4 py-4">Équipe Didask</th><th class="px-4 py-4 cursor-pointer hover:text-slate-700 w-48" onclick="toggleSort('score')">Health Score ${getSortIcon('score')}</th><th class="px-4 py-4 cursor-pointer hover:text-slate-700 w-48" onclick="toggleSort('risk')">Risque Churn ${getSortIcon('risk')}</th><th class="px-4 py-4">Dernier Contact</th><th class="px-6 py-4 text-right">Actions</th></tr>`;
        }

        let tb = document.getElementById('table-body');
        tb.innerHTML = '';

        data.forEach(c => {
            let details = getScoreDetails(c);
            let s = details.total;
            let riskObj = getChurnRisk(c, s);
            let riskScore = riskObj.total;

            let col = s >= 70 ? 'text-emerald-500' : (s >= 40 ? 'text-[#f9b494]' : 'text-rose-500');
            let bgC = s >= 70 ? 'bg-emerald-400' : (s >= 40 ? 'bg-[#f9b494]' : 'bg-rose-500');
            let riskCol = riskScore >= 50 ? 'text-rose-500' : (riskScore >= 30 ? 'text-[#f9b494]' : 'text-emerald-500');
            let riskBgC = riskScore >= 50 ? 'bg-rose-500' : (riskScore >= 30 ? 'bg-[#f9b494]' : 'bg-emerald-400');
            let tbColor = c.tier === 'Premium' ? 'bg-[#1a1a1a] text-[#f9b494]' : (c.tier === 'Standard' ? 'bg-slate-200 text-slate-700' : 'bg-slate-100 text-slate-400');

            let trendHTML = '';
            if (c.trend > 0) trendHTML = `<span class="text-[10px] font-bold text-emerald-500 ml-2" title="+${c.trend} points depuis 30j">↗ +${c.trend}</span>`;
            else if (c.trend < 0) trendHTML = `<span class="text-[10px] font-bold text-rose-500 ml-2" title="${c.trend} points depuis 30j">↘ ${c.trend}</span>`;
            else trendHTML = `<span class="text-[10px] font-bold text-slate-300 ml-2" title="Stable">→ =</span>`;

            let hsTooltipHTML = `<div class="score-tooltip-box absolute top-full left-1/2 w-56 bg-[#1a1a1a] text-white p-4 rounded-xl shadow-2xl z-50 mt-2 pointer-events-none border border-slate-700"><p class="text-[9px] text-slate-400 uppercase font-bold mb-3 tracking-widest text-center border-b border-slate-700 pb-2">Détail du Health Score</p><div class="flex justify-between text-xs mb-1"><span>Pulse</span><span class="font-bold text-[#f9b494]">${details.pulsePts}/20</span></div><div class="flex justify-between text-xs mb-1"><span>Engagement</span><span class="font-bold text-[#f9b494]">${details.engPts}/40</span></div><div class="flex justify-between text-xs mb-1"><span>Relation</span><span class="font-bold text-[#f9b494]">${details.relPts}/30</span></div><div class="flex justify-between text-xs mb-2"><span>Proactivité</span><span class="font-bold text-[#f9b494]">${details.proPts}/10</span></div><div class="flex justify-between text-sm font-black pt-2 border-t border-slate-700 text-${s >= 70 ? 'emerald-400' : (s >= 40 ? '[#f9b494]' : 'rose-400')}"><span>Total</span><span>${s}/100</span></div></div>`;

            let riskTooltipHTML = `<div class="score-tooltip-box absolute top-full left-1/2 w-56 bg-slate-800 text-white p-4 rounded-xl shadow-2xl z-50 mt-2 pointer-events-none border border-slate-600"><p class="text-[9px] text-slate-400 uppercase font-bold mb-3 tracking-widest text-center border-b border-slate-600 pb-2">Pondération du Risque</p><div class="flex justify-between text-xs mb-1"><span>Santé Dégradée</span><span class="font-bold text-rose-300">${riskObj.healthRisk}/60</span></div><div class="flex justify-between text-xs mb-2"><span>Urgence (${riskObj.daysLeft}j)</span><span class="font-bold text-rose-300">${riskObj.timeRisk}/40</span></div><div class="flex justify-between text-sm font-black pt-2 border-t border-slate-600 text-${riskScore >= 50 ? 'rose-400' : (riskScore >= 30 ? '[#f9b494]' : 'emerald-400')}"><span>Risque Total</span><span>${riskScore}/100</span></div></div>`;

            let tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50 cursor-pointer border-b border-slate-50 group";
            tr.onclick = () => openDetails(c.id);

            let baseHTML = `<td class="px-6 py-5"><span class="px-2 py-0.5 rounded text-[9px] font-bold uppercase ${tbColor}">${c.tier}</span><p class="font-bold text-lg mt-1 group-hover:text-[#f9b494] transition-colors">${c.name}</p><p class="text-[10px] text-slate-400 mt-1 font-semibold uppercase tracking-widest">Fin: ${c.end}</p></td>`;

            let quickActions = `<div class="flex items-center justify-end space-x-3"><div class="opacity-0 group-hover:opacity-100 transition-opacity flex space-x-1"><button onclick="simulateQuickAction('Loguer un email', '${c.name}')" class="p-1.5 text-slate-400 hover:text-white hover:bg-[#f9b494] rounded transition-colors" title="Email">✉️</button><button onclick="simulateQuickAction('Loguer un appel', '${c.name}')" class="p-1.5 text-slate-400 hover:text-white hover:bg-[#f9b494] rounded transition-colors" title="Appel">📞</button><button onclick="simulateQuickAction('Ajouter une note', '${c.name}')" class="p-1.5 text-slate-400 hover:text-white hover:bg-[#f9b494] rounded transition-colors" title="Note HubSpot">📝</button></div><button class="text-[10px] font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded group-hover:bg-[#1a1a1a] group-hover:text-white transition-colors">Détails</button></div>`;

            if (activeTab === 'ai') {
                let aiC = c.aiAct ? `<span class="px-2 py-1 bg-emerald-100 text-emerald-700 rounded text-[10px] font-bold">Activé</span><p class="text-[11px] font-bold mt-1">${c.aiMsg} msg/u</p>` : `<span class="px-2 py-1 bg-slate-100 text-slate-400 rounded text-[10px] font-bold">Inactif</span>`;
                let coC = c.coachAct ? `<span class="px-2 py-1 bg-emerald-100 text-emerald-700 rounded text-[10px] font-bold">Activé</span><p class="text-[11px] font-bold mt-1">${c.coachMsg} msg/u</p>` : `<span class="px-2 py-1 bg-slate-100 text-slate-400 rounded text-[10px] font-bold">Inactif</span>`;
                tr.innerHTML = baseHTML + `<td class="px-4 py-5 text-center bg-indigo-50/30 border-l border-indigo-50">${aiC}</td><td class="px-4 py-5 text-center bg-purple-50/30 border-l border-indigo-50">${coC}</td><td class="px-6 py-5">${quickActions}</td>`;
            } else if (activeTab === 'exp') {
                let seatBadge = c.seatsUsed > c.seatsContract ? `<span class="bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded text-[9px] font-bold ml-2 uppercase tracking-widest">Upsell</span>` : '';
                let creditBadge = c.creditsUsed > c.creditsContract ? `<span class="bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded text-[9px] font-bold ml-2 uppercase tracking-widest">Upsell</span>` : '';
                let seatColor = c.seatsUsed > c.seatsContract ? 'text-emerald-500 font-bold' : 'text-slate-600';
                let creditColor = c.creditsUsed > c.creditsContract ? 'text-emerald-500 font-bold' : 'text-slate-600';
                tr.innerHTML = baseHTML + `<td class="px-4 py-5 score-tooltip relative"><div class="flex items-center space-x-1"><span class="font-black text-sm w-8 ${col}">${s}</span><span class="text-[10px] text-slate-400 font-bold">/100</span>${trendHTML}</div>${hsTooltipHTML}</td><td class="px-4 py-5 text-sm"><span class="${seatColor}">${c.seatsUsed}</span> / ${c.seatsContract} ${seatBadge}</td><td class="px-4 py-5 text-sm"><span class="${creditColor}">${c.creditsUsed}</span> / ${c.creditsContract} ${creditBadge}</td><td class="px-6 py-5">${quickActions}</td>`;
            } else {
                let meetMax = c.tier === "Premium" ? 30 : (c.tier === "Standard" ? 90 : 365);
                let meetColor = c.meet <= meetMax ? 'text-[#1a1a1a]' : 'text-rose-500';
                tr.innerHTML = baseHTML + `<td class="px-4 py-5"><p class="text-xs font-bold text-slate-700">CSM: <span class="text-[#f9b494]">${c.csm}</span></p><p class="text-[10px] mt-1 text-slate-500 font-semibold uppercase">KAM: ${c.kam}</p></td><td class="px-4 py-5 score-tooltip relative"><div class="flex items-center space-x-1"><span class="font-black text-sm w-8 ${col}">${s}</span><span class="text-[10px] text-slate-400 font-bold">/100</span>${trendHTML}<div class="w-16 h-1.5 bg-slate-100 rounded-full overflow-hidden ml-2"><div class="h-full ${bgC}" style="width:${s}%"></div></div></div>${hsTooltipHTML}</td><td class="px-4 py-5 score-tooltip relative"><div class="flex items-center space-x-1"><span class="font-black text-sm w-8 ${riskCol}">${riskScore}</span><span class="text-[10px] text-slate-400 font-bold">/100</span><div class="w-16 h-1.5 bg-slate-100 rounded-full overflow-hidden ml-2"><div class="h-full ${riskBgC}" style="width:${riskScore}%"></div></div></div>${riskTooltipHTML}</td><td class="px-4 py-5"><p class="text-[11px] font-semibold text-slate-500 uppercase tracking-widest">🤝 RDV: <span class="${meetColor} font-bold">${c.meet}j</span></p></td><td class="px-6 py-5">${quickActions}</td>`;
            }
            tb.appendChild(tr);
        });
    }

    function openDetails(id) {
        let c = DB.find(x => x.id === id);
        let details = getScoreDetails(c);
        document.getElementById('sp-name').innerText = c.name;
        document.getElementById('sp-tier').innerText = c.tier;
        document.getElementById('sp-start').innerText = c.start;
        document.getElementById('sp-end').innerText = c.end;
        document.getElementById('sp-csm').innerText = c.csm;
        document.getElementById('sp-kam').innerText = c.kam;

        let meetAlert = c.meet > details.meetMax ? ' (En retard)' : '';
        document.getElementById('sp-meet').innerText = `Il y a ${c.meet} j` + meetAlert;
        document.getElementById('sp-next').innerText = c.next || "Non planifié";
        document.getElementById('sp-ai').innerHTML = c.aiAct ? `<span class="text-emerald-500 font-bold">${c.aiMsg} msg/user</span>` : `<span class="text-slate-400">Non déployé</span>`;
        document.getElementById('sp-coach').innerHTML = c.coachAct ? `<span class="text-emerald-500 font-bold">${c.coachMsg} msg/user</span>` : `<span class="text-slate-400">Non déployé</span>`;

        document.getElementById('sp-score-breakdown').innerHTML = `<div class="flex justify-between items-center pb-2 border-b border-slate-200"><div><p class="text-[10px] font-bold text-[#1a1a1a] uppercase">1. Sentiment CSM</p><p class="text-[10px] text-slate-400">Note donnée : ${c.pulse}/5</p></div><span class="text-xs font-bold ${details.pulsePts === 20 ? 'text-emerald-500' : 'text-[#f9b494]'}">${details.pulsePts} / 20 pts</span></div><div class="flex justify-between items-center pb-2 border-b border-slate-200"><div><p class="text-[10px] font-bold text-[#1a1a1a] uppercase">2. Engagement</p><p class="text-[10px] text-slate-400">Moyenne connexion : ${details.avgLog} jours</p></div><span class="text-xs font-bold ${details.engPts === 40 ? 'text-emerald-500' : 'text-[#f9b494]'}">${details.engPts} / 40 pts</span></div><div class="flex justify-between items-center pb-2 border-b border-slate-200"><div><p class="text-[10px] font-bold text-[#1a1a1a] uppercase">3. Relation & ${c.tier}</p><p class="text-[10px] text-slate-400">Dernier RDV : ${c.meet}j (Attendu : ${details.meetMax}j)</p></div><span class="text-xs font-bold ${details.relPts === 30 ? 'text-emerald-500' : 'text-rose-500'}">${details.relPts} / 30 pts</span></div><div class="flex justify-between items-center"><div><p class="text-[10px] font-bold text-[#1a1a1a] uppercase">4. Proactivité</p><p class="text-[10px] text-slate-400">RDV planifié : ${c.next ? 'Oui' : 'Non'}</p></div><span class="text-xs font-bold ${details.proPts === 10 ? 'text-emerald-500' : 'text-slate-400'}">${details.proPts} / 10 pts</span></div>`;

        let badge = document.getElementById('sp-badge');
        badge.innerText = details.total >= 70 ? 'Sain' : (details.total >= 40 ? 'Vigilance' : 'Risque');
        badge.className = `px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest ${details.total >= 70 ? 'bg-emerald-50 text-emerald-600' : (details.total >= 40 ? 'bg-orange-50 text-orange-600' : 'bg-rose-50 text-rose-600')}`;

        document.getElementById('side-panel').classList.remove('closed');
        document.getElementById('overlay').classList.remove('hidden');
    }

    function closeDetails() {
        document.getElementById('side-panel').classList.add('closed');
        document.getElementById('overlay').classList.add('hidden');
    }

    document.getElementById('searchInput').addEventListener('input', drawTable);
    document.getElementById('csmFilter').addEventListener('change', drawTable);
    document.getElementById('kamFilter').addEventListener('change', drawTable);
    document.getElementById('tierFilter').addEventListener('change', drawTable);

    drawTable();
</script>
